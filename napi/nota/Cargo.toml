[package]
name = "nota"
version = "0.0.1"
authors = ["Will Crichton <crichton.will@gmail.com>"]
# categories.workspace = true
edition.workspace = true
# homepage.workspace = true
include = ["/src", "README.md"]
# keywords.workspace = true
# license.workspace = true
publish = false
# repository.workspace = true
rust-version.workspace = true
description = "Nota reader compiled to WebAssembly for the in-browser playground."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
oxc = { workspace = true, features = ["codegen", "serialize"] }
wasm-bindgen = "=0.2.126"
serde = { workspace = true, features = ["derive"] }
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
console_error_panic_hook = "0.1"

[package.metadata.cargo-shear]
ignored = ["console_error_panic_hook"]