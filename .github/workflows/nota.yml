name: Nota

# The Nota reader's own CI on this fork. Upstream workflows are all PR-triggered or
# push-filtered to `main`, so pushes to `nota` run exactly this workflow.
on:
  workflow_dispatch:
  push:
    branches: [nota, solid]
  pull_request:
    branches: [nota, solid]

permissions:
  contents: read

concurrency:
  group: nota-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Reader tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Install Binaryen
        env:
          BINARYEN_VERSION: "132"
        run: |
          mkdir -p "$RUNNER_TEMP/binaryen"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz --strip-components=1 -C "$RUNNER_TEMP/binaryen"
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126

      - name: Tests
        run: just nota-tests

      - name: Build wasm
        run: |
          rustup target add wasm32-unknown-unknown
          just nota-build
