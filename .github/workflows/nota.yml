name: Nota

# The Nota reader's own CI on this fork. Upstream workflows are all PR-triggered or
# push-filtered to `main`, so pushes to `nota` run exactly this workflow.
on:
  workflow_dispatch:
  push:
    branches: [nota, solid]
  pull_request:
    branches: [nota, solid]

permissions:
  contents: read

concurrency:
  group: nota-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Reader tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Install wasm-bindgen + binaryen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126,binaryen

      - name: Tests
        run: just nota-tests

      - name: Build wasm
        run: |
          rustup target add wasm32-unknown-unknown
          just nota-build
