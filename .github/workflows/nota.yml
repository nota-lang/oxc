name: Nota

# The Nota reader's own CI on this fork. Upstream workflows are all PR-triggered or
# push-filtered to `main`, so pushes to `nota` run exactly this workflow.
on:
  workflow_dispatch:
  push:
    branches: [nota]
  pull_request:
    branches: [nota]

permissions:
  contents: read

concurrency:
  group: nota-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Reader tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test -p oxc -p oxc_transformer -p oxc_codegen nota

      - name: nota_wasm compiles for wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p nota_wasm --target wasm32-unknown-unknown
